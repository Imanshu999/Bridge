name: Build live catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: catalog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Build movies, series, anime, channels and real reviews
        env:
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
        run: python scraper.py
      - name: Validate JSON feed
        run: python -m json.tool public/catalog.json > /dev/null
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json
          git diff --cached --quiet || git commit -m "chore: refresh live catalog"
          # Another scheduled/manual run may update main while this job is building.
          git pull --rebase origin main
          git push
